name: Monitor de chances

on:
  schedule:
    - cron: "*/15 15-23 * * *"
    - cron: "*/15 0-5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-chances
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Revisar resultados y avisar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SORTEOS: ${{ vars.SORTEOS }}
        run: python main.py
      - name: Guardar historial
        if: always()
        run: |
          git config user.name "chance-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historial.json
          git diff --cached --quiet || (git commit -m "Actualiza historial" && git push)
